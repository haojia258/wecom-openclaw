<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Mission Control Dashboard v0.4</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
  background: #0d1117;
  color: #c9d1d9;
  line-height: 1.5;
}
.header {
  background: #161b22;
  border-bottom: 1px solid #30363d;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header h1 {
  font-size: 20px;
  font-weight: 600;
  color: #58a6ff;
}
.header .stats {
  display: flex;
  gap: 16px;
  font-size: 13px;
}
.header .stats span {
  background: #21262d;
  padding: 4px 12px;
  border-radius: 12px;
  border: 1px solid #30363d;
}
.container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  padding: 16px 24px;
  min-height: calc(100vh - 130px);
}
.panel {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 8px;
  overflow: hidden;
}
.panel-header {
  padding: 12px 16px;
  border-bottom: 1px solid #30363d;
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.panel-body {
  padding: 12px 16px;
  overflow-y: auto;
  max-height: calc(100vh - 200px);
}
.task-row {
  padding: 10px 12px;
  border-bottom: 1px solid #21262d;
  cursor: pointer;
  transition: background 0.15s;
  border-left: 3px solid transparent;
}
.task-row:hover { background: #1c2128; }
.task-row.active {
  background: #1c2541;
  border-left-color: #58a6ff;
}
.task-row .top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.task-row .title {
  font-weight: 600;
  font-size: 14px;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.task-row .meta {
  display: flex;
  gap: 12px;
  font-size: 12px;
  color: #8b949e;
  flex-wrap: wrap;
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
}
.badge-pending { background: #21262d; color: #8b949e; }
.badge-running,
.badge-in_progress { background: #1c3a5c; color: #58a6ff; }
.badge-completed { background: #1a3d2e; color: #3fb950; }
.badge-failed { background: #3d1a1a; color: #f85149; }
.badge-blocked { background: #3d2e1a; color: #d29922; }
.badge-rollback { background: #3d2a1a; color: #e39038; }
.badge-stage { background: #1c2541; color: #58a6ff; font-size: 10px; }
.event-item {
  padding: 8px 0;
  border-bottom: 1px solid #21262d;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.event-item .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-top: 6px;
  flex-shrink: 0;
}
.dot-info { background: #58a6ff; }
.dot-success { background: #3fb950; }
.dot-warn { background: #d29922; }
.dot-error { background: #f85149; }
.dot-transition { background: #a371f7; }
.event-item .content {
  flex: 1;
  font-size: 13px;
}
.event-item .content .type {
  font-weight: 600;
  margin-bottom: 2px;
}
.event-item .content .stage {
  font-size: 11px;
  color: #8b949e;
}
.event-item .content .payload {
  font-size: 11px;
  color: #6e7681;
  margin-top: 2px;
  font-family: 'SF Mono', Consolas, monospace;
  background: #0d1117;
  padding: 4px 8px;
  border-radius: 4px;
  overflow-x: auto;
  max-height: 80px;
  overflow-y: auto;
}
.event-item .content .transition-arrow {
  color: #a371f7;
  font-weight: bold;
  font-size: 13px;
}
.event-item .time {
  font-size: 11px;
  color: #484f58;
  flex-shrink: 0;
}
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: #484f58;
  font-size: 14px;
}
.empty-state .icon { font-size: 32px; margin-bottom: 8px; }
.task-detail {
  margin-bottom: 16px;
  padding: 12px;
  background: #0d1117;
  border-radius: 6px;
  border: 1px solid #21262d;
}
.task-detail .row {
  display: flex;
  gap: 16px;
  font-size: 13px;
  margin-bottom: 4px;
}
.task-detail .row label {
  color: #8b949e;
  min-width: 90px;
}
.task-detail .row a {
  color: #58a6ff;
  text-decoration: none;
}
/* P10.1: Stage Progress Bar */
.stage-progress {
  margin-top: 10px;
  padding: 10px 0;
  border-top: 1px solid #21262d;
}
.stage-progress .title {
  font-size: 11px;
  color: #8b949e;
  margin-bottom: 8px;
  font-weight: 600;
  text-transform: uppercase;
}
.stage-bar {
  display: flex;
  align-items: center;
  gap: 0;
}
.stage-step {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
  position: relative;
}
.stage-step .node {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #21262d;
  border: 2px solid #30363d;
  z-index: 1;
  transition: all 0.2s;
}
.stage-step .node.done { background: #3fb950; border-color: #2ea043; }
.stage-step .node.current { background: #58a6ff; border-color: #58a6ff; box-shadow: 0 0 6px rgba(88,166,255,0.5); }
.stage-step .node.failed { background: #f85149; border-color: #f85149; }
.stage-step .node.rollback { background: #d29922; border-color: #d29922; }
.stage-step .label {
  font-size: 9px;
  color: #484f58;
  margin-top: 4px;
  text-align: center;
  white-space: nowrap;
}
.stage-step .label.active { color: #58a6ff; font-weight: 600; }
.stage-step .label.done { color: #3fb950; }
.stage-step .line {
  position: absolute;
  top: 5px;
  left: 50%;
  width: 100%;
  height: 2px;
  background: #21262d;
  z-index: 0;
}
.stage-step .line.done { background: #3fb950; }
.stage-step:last-child .line { display: none; }
/* P10.1: Workflow History */
.workflow-history {
  margin-top: 12px;
  padding-top: 8px;
  border-top: 1px solid #21262d;
}
.workflow-history .title {
  font-size: 11px;
  color: #8b949e;
  margin-bottom: 6px;
  font-weight: 600;
  text-transform: uppercase;
}
.workflow-history .history-item {
  font-size: 11px;
  color: #8b949e;
  padding: 2px 0;
  display: flex;
  gap: 8px;
  align-items: center;
}
.workflow-history .history-item .arrow {
  color: #a371f7;
}
.loading {
  text-align: center;
  padding: 20px;
  color: #8b949e;
}
.refresh-btn {
  background: #21262d;
  border: 1px solid #30363d;
  color: #c9d1d9;
  padding: 4px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
}
.refresh-btn:hover { background: #30363d; }
/* P10.3: Tabs */
.tabs {
  display: flex;
  border-bottom: 1px solid #30363d;
  margin-bottom: 0;
}
.tab {
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 500;
  color: #8b949e;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
}
.tab:hover { color: #c9d1d9; }
.tab.active {
  color: #58a6ff;
  border-bottom-color: #58a6ff;
}
.tab-content { display: none; }
.tab-content.active { display: block; }
/* P10.3: Artifact row */
.artifact-row {
  padding: 10px 12px;
  border-bottom: 1px solid #21262d;
  cursor: pointer;
  transition: background 0.15s;
  display: flex;
  align-items: center;
  gap: 8px;
}
.artifact-row:hover { background: #1c2128; }
.artifact-row .icon {
  font-size: 16px;
  flex-shrink: 0;
}
.artifact-row .info {
  flex: 1;
  min-width: 0;
}
.artifact-row .name {
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.artifact-row .meta {
  font-size: 11px;
  color: #8b949e;
  margin-top: 2px;
}
.artifact-row .size {
  font-size: 11px;
  color: #484f58;
  flex-shrink: 0;
}
/* P10.4: Capability Check */
.cap-panel {
  margin-top: 16px;
}
.cap-check-form {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px;
  background: #0d1117;
  border-radius: 6px;
  border: 1px solid #21262d;
}
.cap-check-form select, .cap-check-form input {
  background: #161b22;
  border: 1px solid #30363d;
  color: #c9d1d9;
  padding: 6px 10px;
  border-radius: 4px;
  font-size: 13px;
  font-family: inherit;
}
.cap-check-form button {
  background: #238636;
  border: none;
  color: #fff;
  padding: 6px 12px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
}
.cap-check-form button:hover { background: #2ea043; }
.cap-result {
  margin-top: 8px;
  padding: 10px;
  border-radius: 6px;
  font-size: 13px;
}
.cap-result.allowed { background: #1a3d2e; border: 1px solid #2ea043; color: #3fb950; }
.cap-result.denied { background: #3d1a1a; border: 1px solid #f85149; color: #f85149; }
.cap-result.approval { background: #3d2e1a; border: 1px solid #d29922; color: #d29922; }
.cap-agents-list {
  margin-top: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.cap-agent-row {
  padding: 8px 10px;
  background: #0d1117;
  border-radius: 4px;
  border: 1px solid #21262d;
  font-size: 12px;
}
.cap-agent-row .agent-name {
  font-weight: 600;
  color: #58a6ff;
  margin-bottom: 4px;
}
.cap-agent-row .caps {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.cap-agent-row .cap-tag {
  padding: 1px 6px;
  border-radius: 8px;
  font-size: 10px;
}
.cap-tag.allowed { background: #1a3d2e; color: #3fb950; }
.cap-tag.forbidden { background: #3d1a1a; color: #f85149; }
.cap-tag.approval { background: #3d2e1a; color: #d29922; }
/* Artifact popup */
.artifact-popup {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.artifact-popup.show { display: flex; }
.artifact-popup .popup-content {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 8px;
  padding: 20px;
  max-width: 80vw;
  max-height: 80vh;
  overflow-y: auto;
  min-width: 400px;
}
.artifact-popup .popup-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  border-bottom: 1px solid #30363d;
  padding-bottom: 8px;
}
.artifact-popup .popup-close {
  background: none;
  border: none;
  color: #8b949e;
  font-size: 20px;
  cursor: pointer;
}
.artifact-popup .popup-body {
  font-family: 'SF Mono', Consolas, monospace;
  font-size: 12px;
  white-space: pre-wrap;
  background: #0d1117;
  padding: 12px;
  border-radius: 4px;
  max-height: 50vh;
  overflow-y: auto;
  line-height: 1.4;
}
</style>
</head>
<body>
<div class="header">
  <h1>AI Mission Control Dashboard v0.4</h1>
  <div class="stats" id="stats"></div>
</div>
<div class="container">
  <div class="panel" id="tasks-panel">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('tasks')" id="tab-tasks">Tasks</div>
      <div class="tab" onclick="switchTab('artifacts')" id="tab-artifacts">Artifacts</div>
    </div>
    <div class="tab-content active" id="tab-content-tasks">
      <div class="panel-header">
        <span>Mission Tasks</span>
        <button class="refresh-btn" onclick="loadTasks()">Refresh</button>
      </div>
      <div class="panel-body" id="tasks-list">
        <div class="loading">Loading...</div>
      </div>
    </div>
    <div class="tab-content" id="tab-content-artifacts">
      <div class="panel-header">
        <span>Artifacts</span>
        <button class="refresh-btn" onclick="loadArtifacts()">Refresh</button>
      </div>
      <div class="panel-body" id="artifacts-list">
        <div class="empty-state">
          <div class="icon">&#x1F4E6;</div>
          <div>Select a task to view its artifacts</div>
        </div>
      </div>
    </div>
  </div>
  <div class="panel" id="events-panel">
    <div class="panel-header">
      <span id="events-title">Event Timeline</span>
      <button class="refresh-btn" onclick="loadEvents()">Refresh</button>
    </div>
    <div class="panel-body" id="events-list">
      <div class="empty-state">
        <div class="icon">&#x1F4CB;</div>
        <div>Select a task to view its event timeline</div>
      </div>
    </div>
  </div>
</div>

<!-- P10.4 Capability Check Panel -->
<div style="padding: 0 24px 16px;">
  <div class="panel">
    <div class="panel-header">
      <span>Capability Check</span>
      <button class="refresh-btn" onclick="loadAgents()">Refresh</button>
    </div>
    <div class="panel-body">
      <div class="cap-check-form">
        <select id="cap-agent-select">
          <option value="">Select Agent...</option>
        </select>
        <input type="text" id="cap-input" placeholder="Capability (e.g. pm2.restart)" />
        <div style="display:flex; gap:8px;">
          <button onclick="checkCapability()">Check</button>
        </div>
      </div>
      <div id="cap-result"></div>
      <div class="cap-agents-list" id="cap-agents-list"></div>
    </div>
  </div>
</div>

<!-- Artifact Content Popup -->
<div class="artifact-popup" id="artifact-popup">
  <div class="popup-content">
    <div class="popup-header">
      <span id="popup-title" style="font-weight:600;color:#58a6ff;">Artifact</span>
      <button class="popup-close" onclick="closePopup()">&times;</button>
    </div>
    <div class="popup-body" id="popup-body"></div>
  </div>
</div>

<script>
var currentTaskId = null;
var STAGES = ['queued', 'running', 'testing', 'audit', 'staging', 'production', 'completed'];

function getStatusBadge(status) {
  var cls = 'badge-';
  if (!status) return '<span class="badge badge-pending">unknown</span>';
  var s = status.toLowerCase();
  if (s === 'pending') cls += 'pending';
  else if (s === 'running' || s === 'in_progress') cls += 'in_progress';
  else if (s === 'completed') cls += 'completed';
  else if (s === 'failed') cls += 'failed';
  else if (s === 'blocked') cls += 'blocked';
  else if (s === 'rollback') cls += 'rollback';
  else cls += 'pending';
  return '<span class="badge ' + cls + '">' + escapeHtml(status) + '</span>';
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatTime(iso) {
  if (!iso) return '-';
  var d = new Date(iso);
  return d.toLocaleString('zh-CN', { hour12: false });
}

function loadTasks() {
  var list = document.getElementById('tasks-list');
  list.innerHTML = '<div class="loading">Loading...</div>';

  fetch('/mission/tasks')
    .then(function(r) { return r.json(); })
    .then(function(resp) {
      if (!resp.success) {
        list.innerHTML = '<div class="empty-state"><div class="icon">&#x26A0;</div><div>Failed: ' + escapeHtml(resp.error) + '</div></div>';
        return;
      }

      // Update stats
      var statsEl = document.getElementById('stats');
      var s = resp.stats;
      var total = s.total || 0;
      statsEl.innerHTML = '<span>Total: ' + total + '</span>' +
        (s.by_status ? Object.keys(s.by_status).map(function(k) {
          return '<span>' + k + ': ' + s.by_status[k] + '</span>';
        }).join('') : '');

      var tasks = resp.data || [];
      if (tasks.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="icon">&#x1F4ED;</div><div>No mission tasks yet</div></div>';
        return;
      }

      var html = '';
      for (var i = 0; i < tasks.length; i++) {
        var t = tasks[i];
        var activeClass = (currentTaskId === t.id) ? ' active' : '';
        html += '<div class="task-row' + activeClass + '" onclick="selectTask(\'' + escapeHtml(t.id) + '\')">';
        html += '<div class="top">';
        html += '<span class="title">' + escapeHtml(t.title || t.id) + '</span>';
        html += getStatusBadge(t.status);
        if (t.current_stage) {
          html += '<span class="badge badge-stage">' + escapeHtml(t.current_stage) + '</span>';
        }
        html += '</div>';
        html += '<div class="meta">';
        html += '<span title="Agent">Agent: ' + escapeHtml(t.owner_agent) + '</span>';
        if (t.github_pr) html += '<span title="PR">PR: ' + escapeHtml(t.github_pr) + '</span>';
        if (t.last_event_at) html += '<span title="Last Event">Last: ' + formatTime(t.last_event_at) + '</span>';
        html += '</div>';
        html += '</div>';
      }
      list.innerHTML = html;
    })
    .catch(function(e) {
      list.innerHTML = '<div class="empty-state"><div class="icon">&#x26A0;</div><div>Error: ' + escapeHtml(e.message) + '</div></div>';
    });
}

function selectTask(taskId) {
  currentTaskId = taskId;
  loadTasks(); // re-render to highlight
  loadEvents();
}

function renderStageProgress(currentStage) {
  var html = '<div class="stage-progress">';
  html += '<div class="title">Workflow Progress</div>';
  html += '<div class="stage-bar">';

  var currentIndex = STAGES.indexOf(currentStage);
  if (currentIndex < 0 && currentStage) {
    // Special states: failed, rollback
    currentIndex = -1;
  }

  for (var i = 0; i < STAGES.length; i++) {
    var stage = STAGES[i];
    var nodeClass = 'node';
    var labelClass = 'label';
    var lastDoneStage = false;

    if (currentStage === 'failed') {
      // Mark current stage as failed
      if (stage === currentStage) {
        nodeClass += ' failed';
        labelClass += ' active';
      }
    } else if (currentStage === 'rollback') {
      if (stage === currentStage) {
        nodeClass += ' rollback';
        labelClass += ' active';
      }
    } else if (currentIndex >= 0) {
      if (i < currentIndex) {
        nodeClass += ' done';
        labelClass += ' done';
      } else if (i === currentIndex) {
        nodeClass += ' current';
        labelClass += ' active';
      }
    }

    html += '<div class="stage-step">';
    if (i < STAGES.length - 1) {
      var lineClass = 'line';
      if (currentIndex >= 0 && i < currentIndex) lineClass += ' done';
      html += '<div class="' + lineClass + '"></div>';
    }
    html += '<div class="' + nodeClass + '"></div>';
    html += '<div class="' + labelClass + '">' + escapeHtml(stage) + '</div>';
    html += '</div>';
  }

  html += '</div></div>';
  return html;
}

function renderWorkflowHistory(events) {
  var transitions = [];
  for (var i = 0; i < events.length; i++) {
    if (events[i].event_type === 'TASK_STAGE_CHANGED' && events[i].payload) {
      transitions.push({
        from: events[i].payload.from_stage,
        to: events[i].payload.to_stage,
        trigger: events[i].payload.trigger_event,
        time: events[i].created_at
      });
    }
  }

  if (transitions.length === 0) return '';

  var html = '<div class="workflow-history">';
  html += '<div class="title">Workflow History</div>';
  for (var j = 0; j < transitions.length; j++) {
    var t = transitions[j];
    html += '<div class="history-item">';
    html += '<span>' + escapeHtml(t.from) + '</span>';
    html += '<span class="arrow">→</span>';
    html += '<span>' + escapeHtml(t.to) + '</span>';
    html += '<span style="margin-left:8px;color:#484f58;font-size:10px">via ' + escapeHtml(t.trigger) + ' @ ' + formatTime(t.time) + '</span>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function getEventDotClass(eventType) {
  if (!eventType) return 'dot-info';
  var et = eventType.toLowerCase();
  if (et === 'task_stage_changed') return 'dot-transition';
  if (et.indexOf('error') >= 0 || et.indexOf('failed') >= 0) return 'dot-error';
  if (et.indexOf('complete') >= 0 || et.indexOf('deployed') >= 0 || et.indexOf('passed') >= 0) return 'dot-success';
  if (et.indexOf('warn') >= 0) return 'dot-warn';
  return 'dot-info';
}

function loadEvents() {
  var eventsDiv = document.getElementById('events-list');
  var titleEl = document.getElementById('events-title');

  if (!currentTaskId) {
    eventsDiv.innerHTML = '<div class="empty-state"><div class="icon">&#x1F4CB;</div><div>Select a task to view its event timeline</div></div>';
    titleEl.textContent = 'Event Timeline';
    return;
  }

  eventsDiv.innerHTML = '<div class="loading">Loading...</div>';
  titleEl.textContent = 'Events: ' + currentTaskId;

  fetch('/mission/tasks/' + encodeURIComponent(currentTaskId) + '/events')
    .then(function(r) { return r.json(); })
    .then(function(resp) {
      if (!resp.success) {
        eventsDiv.innerHTML = '<div class="empty-state"><div class="icon">&#x26A0;</div><div>Error: ' + escapeHtml(resp.error) + '</div></div>';
        return;
      }

      var task = resp.task;
      var events = resp.events || [];

      var html = '';

      // Task detail header
      if (task) {
        html += '<div class="task-detail">';
        html += '<div class="row"><label>Task ID:</label><span>' + escapeHtml(task.id) + '</span></div>';
        html += '<div class="row"><label>Status:</label>' + getStatusBadge(task.status) + '</div>';
        html += '<div class="row"><label>Agent:</label><span>' + escapeHtml(task.owner_agent) + '</span></div>';
        html += '<div class="row"><label>Stage:</label><span class="badge badge-stage">' + escapeHtml(task.current_stage || '-') + '</span></div>';
        if (task.github_pr) {
          html += '<div class="row"><label>GitHub PR:</label><a href="' + escapeHtml(task.github_pr) + '" target="_blank">' + escapeHtml(task.github_pr) + '</a></div>';
        }
        if (task.description) {
          html += '<div class="row"><label>Desc:</label><span>' + escapeHtml(task.description.slice(0, 200)) + '</span></div>';
        }
        html += '<div class="row"><label>Created:</label><span>' + formatTime(task.created_at) + '</span></div>';
        html += '<div class="row"><label>Last Event:</label><span>' + formatTime(task.last_event_at) + '</span></div>';

        // P10.1: Stage progress bar
        html += renderStageProgress(task.current_stage);

        // P10.1: Workflow history
        html += renderWorkflowHistory(events);

        html += '</div>';
      }

      // Event timeline
      if (events.length === 0) {
        html += '<div class="empty-state"><div>No events recorded yet</div></div>';
      } else {
        for (var i = 0; i < events.length; i++) {
          var evt = events[i];
          var dotClass = getEventDotClass(evt.event_type);

          var isStageChange = evt.event_type === 'TASK_STAGE_CHANGED';

          html += '<div class="event-item">';
          html += '<div class="dot ' + dotClass + '"></div>';
          html += '<div class="content">';
          if (isStageChange && evt.payload) {
            html += '<div class="type">' + escapeHtml(evt.event_type) + '</div>';
            html += '<div class="transition-arrow">' +
              escapeHtml(evt.payload.from_stage || '?') + ' → ' +
              escapeHtml(evt.payload.to_stage || '?') + '</div>';
            if (evt.payload.trigger_event) {
              html += '<div class="stage">Trigger: ' + escapeHtml(evt.payload.trigger_event) + '</div>';
            }
          } else {
            html += '<div class="type">' + escapeHtml(evt.event_type) + '</div>';
            if (evt.stage) html += '<div class="stage">Stage: ' + escapeHtml(evt.stage) + '</div>';
            if (evt.payload) html += '<div class="payload">' + escapeHtml(JSON.stringify(evt.payload, null, 2)) + '</div>';
          }
          html += '</div>';
          html += '<div class="time">' + formatTime(evt.created_at) + '</div>';
          html += '</div>';
        }
      }

      eventsDiv.innerHTML = html;
    })
    .catch(function(e) {
      eventsDiv.innerHTML = '<div class="empty-state"><div class="icon">&#x26A0;</div><div>Error: ' + escapeHtml(e.message) + '</div></div>';
    });
}

// Auto-refresh every 10 seconds
setInterval(function() {
  loadTasks();
  if (currentTaskId) loadEvents();
}, 10000);

// Initial load
loadTasks();
loadAgents();

// ─── P10.3 + P10.4: Tabs, Artifacts, Capability ─────────

function switchTab(tabName) {
  var tabs = document.querySelectorAll('.tab');
  var contents = document.querySelectorAll('.tab-content');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.remove('active');
  }
  for (var j = 0; j < contents.length; j++) {
    contents[j].classList.remove('active');
  }
  document.getElementById('tab-' + tabName).classList.add('active');
  document.getElementById('tab-content-' + tabName).classList.add('active');

  if (tabName === 'artifacts') {
    loadArtifacts();
  }
}

function loadArtifacts() {
  var list = document.getElementById('artifacts-list');

  if (!currentTaskId) {
    list.innerHTML = '<div class="empty-state"><div class="icon">&#x1F4E6;</div><div>Select a task to view its artifacts</div></div>';
    return;
  }

  list.innerHTML = '<div class="loading">Loading...</div>';

  fetch('/mission/' + encodeURIComponent(currentTaskId) + '/artifacts')
    .then(function(r) { return r.json(); })
    .then(function(resp) {
      if (!resp.success) {
        list.innerHTML = '<div class="empty-state"><div class="icon">&#x26A0;</div><div>Error: ' + escapeHtml(resp.error) + '</div></div>';
        return;
      }

      var artifacts = resp.artifacts || [];
      if (artifacts.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="icon">&#x1F4E6;</div><div>No artifacts for this mission</div></div>';
        return;
      }

      var html = '';
      for (var i = 0; i < artifacts.length; i++) {
        var a = artifacts[i];
        var iconEmoji = '&#x1F4C4;';
        if (a.filename && a.filename.endsWith('.json')) iconEmoji = '&#x1F4CA;';
        if (a.filename && a.filename.endsWith('.diff')) iconEmoji = '&#x1F527;';

        html += '<div class="artifact-row" onclick="viewArtifact(\'' + escapeHtml(a.filename) + '\')">';
        html += '<div class="icon">' + iconEmoji + '</div>';
        html += '<div class="info">';
        html += '<div class="name">' + escapeHtml(a.filename) + '</div>';
        html += '<div class="meta">' + escapeHtml(a.agent || '-') + ' &middot; ' + (a.artifact_type || '') + ' &middot; ' + formatTime(a.created_at) + '</div>';
        html += '</div>';
        html += '<div class="size">' + formatSize(a.size) + '</div>';
        html += '</div>';
      }
      list.innerHTML = html;
    })
    .catch(function(e) {
      list.innerHTML = '<div class="empty-state"><div class="icon">&#x26A0;</div><div>Error: ' + escapeHtml(e.message) + '</div></div>';
    });
}

function viewArtifact(filename) {
  if (!currentTaskId || !filename) return;

  var popup = document.getElementById('artifact-popup');
  var title = document.getElementById('popup-title');
  var body = document.getElementById('popup-body');

  title.textContent = 'Artifact: ' + filename;
  body.textContent = 'Loading...';
  popup.classList.add('show');

  fetch('/mission/' + encodeURIComponent(currentTaskId) + '/artifacts/' + encodeURIComponent(filename))
    .then(function(r) { return r.json(); })
    .then(function(resp) {
      if (resp.success) {
        // For JSON, pretty-print
        if (filename.endsWith('.json') && typeof resp.content === 'string') {
          try {
            var parsed = JSON.parse(resp.content);
            body.textContent = JSON.stringify(parsed, null, 2);
          } catch(e) {
            body.textContent = resp.content;
          }
        } else {
          body.textContent = resp.content;
        }
      } else {
        body.textContent = 'Error: ' + resp.error;
      }
    })
    .catch(function(e) {
      body.textContent = 'Error: ' + e.message;
    });
}

function closePopup() {
  document.getElementById('artifact-popup').classList.remove('show');
}

function formatSize(bytes) {
  if (!bytes && bytes !== 0) return '-';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function loadAgents() {
  var select = document.getElementById('cap-agent-select');
  var list = document.getElementById('cap-agents-list');

  fetch('/mission/capability/agents')
    .then(function(r) { return r.json(); })
    .then(function(resp) {
      if (!resp.success) return;

      var agents = resp.agents || [];

      // Update select
      var optHtml = '<option value="">Select Agent...</option>';
      for (var i = 0; i < agents.length; i++) {
        optHtml += '<option value="' + escapeHtml(agents[i].agent) + '">' + escapeHtml(agents[i].agent) + '</option>';
      }
      select.innerHTML = optHtml;

      // Render agent cards
      var html = '';
      for (var j = 0; j < agents.length; j++) {
        var a = agents[j];
        html += '<div class="cap-agent-row">';
        html += '<div class="agent-name">' + escapeHtml(a.agent) + '</div>';
        html += '<div class="caps">';
        for (var k = 0; k < a.capabilities.length; k++) {
          html += '<span class="cap-tag allowed">' + escapeHtml(a.capabilities[k]) + '</span>';
        }
        for (var l = 0; l < a.forbidden.length; l++) {
          html += '<span class="cap-tag forbidden">&#x1F6AB; ' + escapeHtml(a.forbidden[l]) + '</span>';
        }
        for (var m = 0; m < a.requiresApproval.length; m++) {
          html += '<span class="cap-tag approval">&#x1F4CB; ' + escapeHtml(a.requiresApproval[m]) + '</span>';
        }
        html += '</div></div>';
      }
      list.innerHTML = html;
    })
    .catch(function(e) {
      list.innerHTML = '<div style="color:#f85149;font-size:12px;">Error: ' + escapeHtml(e.message) + '</div>';
    });
}

function checkCapability() {
  var agent = document.getElementById('cap-agent-select').value;
  var capability = document.getElementById('cap-input').value.trim();
  var resultDiv = document.getElementById('cap-result');

  if (!agent) {
    resultDiv.innerHTML = '<div class="cap-result denied">Please select an agent</div>';
    return;
  }
  if (!capability) {
    resultDiv.innerHTML = '<div class="cap-result denied">Please enter a capability</div>';
    return;
  }

  resultDiv.innerHTML = '<div style="padding:10px;color:#8b949e;">Checking...</div>';

  fetch('/mission/capability/check', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ agent: agent, capability: capability, mission_id: currentTaskId || '' })
  })
    .then(function(r) { return r.json(); })
    .then(function(resp) {
      if (!resp.success) {
        resultDiv.innerHTML = '<div class="cap-result denied">Error: ' + escapeHtml(resp.error || 'Unknown error') + '</div>';
        return;
      }

      var cls = 'denied';
      var icon = '&#x274C;';
      if (resp.allowed && !resp.requiresApproval) {
        cls = 'allowed';
        icon = '&#x2705;';
      } else if (resp.allowed && resp.requiresApproval) {
        cls = 'approval';
        icon = '&#x26A0;';
      }

      resultDiv.innerHTML = '<div class="cap-result ' + cls + '">' +
        icon + ' <strong>' + escapeHtml(agent) + '</strong> → <strong>' + escapeHtml(capability) + '</strong><br>' +
        (resp.allowed ? 'Allowed' : 'Denied') +
        (resp.requiresApproval ? ' (Requires Approval)' : '') +
        '<br><span style="font-size:11px;opacity:0.7;">' + escapeHtml(resp.reason) + '</span>' +
        '</div>';
    })
    .catch(function(e) {
      resultDiv.innerHTML = '<div class="cap-result denied">Error: ' + escapeHtml(e.message) + '</div>';
    });
}

// Extend loadEvents to also refresh artifacts
var _origLoadEvents = loadEvents;
loadEvents = function() {
  _origLoadEvents();
  if (document.getElementById('tab-content-artifacts').classList.contains('active')) {
    loadArtifacts();
  }
};
</script>
