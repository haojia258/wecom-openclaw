<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Mission Control Dashboard v0.3</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
  background: #0d1117;
  color: #c9d1d9;
  line-height: 1.5;
}
.header {
  background: #161b22;
  border-bottom: 1px solid #30363d;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.header h1 {
  font-size: 20px;
  font-weight: 600;
  color: #58a6ff;
}
.header .badge-version {
  font-size: 11px;
  background: #1c3a5c;
  color: #58a6ff;
  padding: 2px 8px;
  border-radius: 10px;
  margin-left: 8px;
}
.header .stats {
  display: flex;
  gap: 12px;
  font-size: 13px;
}
.header .stats span {
  background: #21262d;
  padding: 4px 12px;
  border-radius: 12px;
  border: 1px solid #30363d;
}
.container {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  padding: 12px 24px;
  min-height: calc(100vh - 130px);
}
.panel {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.panel-header {
  padding: 10px 14px;
  border-bottom: 1px solid #30363d;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.panel-body {
  padding: 10px 14px;
  overflow-y: auto;
  flex: 1;
  max-height: calc(100vh - 200px);
}
.task-row {
  padding: 8px 10px;
  border-bottom: 1px solid #21262d;
  cursor: pointer;
  transition: background 0.15s;
  border-left: 3px solid transparent;
}
.task-row:hover { background: #1c2128; }
.task-row.active {
  background: #1c2541;
  border-left-color: #58a6ff;
}
.task-row .top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 3px;
}
.task-row .title {
  font-weight: 600;
  font-size: 13px;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.task-row .meta {
  display: flex;
  gap: 10px;
  font-size: 11px;
  color: #8b949e;
  flex-wrap: wrap;
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
}
.badge-pending { background: #21262d; color: #8b949e; }
.badge-running,
.badge-in_progress { background: #1c3a5c; color: #58a6ff; }
.badge-completed { background: #1a3d2e; color: #3fb950; }
.badge-failed { background: #3d1a1a; color: #f85149; }
.badge-blocked { background: #3d2e1a; color: #d29922; }
/* P10.2: Recovery badges */
.badge-retrying { background: #1c3a5c; color: #58a6ff; }
.badge-recovered { background: #1a3d2e; color: #3fb950; }
.badge-retry_exhausted { background: #3d2e1a; color: #d29922; }
.badge-rolling_back { background: #3d1a2e; color: #f0883e; }
.badge-rolled_back { background: #2e1a3d; color: #bc8cff; }
.badge-rollback_failed { background: #3d1a1a; color: #f85149; }
.badge-unrecoverable { background: #3d1a1a; color: #f85149; }
.event-item {
  padding: 7px 0;
  border-bottom: 1px solid #21262d;
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.event-item .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-top: 6px;
  flex-shrink: 0;
}
.dot-info { background: #58a6ff; }
.dot-success { background: #3fb950; }
.dot-warn { background: #d29922; }
.dot-error { background: #f85149; }
.dot-retry { background: #79c0ff; }
.dot-rollback { background: #bc8cff; }
.dot-recovery { background: #3fb950; }
.event-item .content {
  flex: 1;
  font-size: 12px;
}
.event-item .content .type {
  font-weight: 600;
  margin-bottom: 1px;
}
.event-item .content .stage {
  font-size: 10px;
  color: #8b949e;
}
.event-item .content .payload {
  font-size: 10px;
  color: #6e7681;
  margin-top: 2px;
  font-family: 'SF Mono', Consolas, monospace;
  background: #0d1117;
  padding: 3px 6px;
  border-radius: 4px;
  overflow-x: auto;
  max-height: 60px;
  overflow-y: auto;
}
.event-item .time {
  font-size: 10px;
  color: #484f58;
  flex-shrink: 0;
}
.empty-state {
  text-align: center;
  padding: 30px 20px;
  color: #484f58;
  font-size: 13px;
}
.empty-state .icon { font-size: 28px; margin-bottom: 6px; }
.task-detail {
  margin-bottom: 12px;
  padding: 10px;
  background: #0d1117;
  border-radius: 6px;
  border: 1px solid #21262d;
}
.task-detail .row {
  display: flex;
  gap: 12px;
  font-size: 12px;
  margin-bottom: 3px;
}
.task-detail .row label {
  color: #8b949e;
  min-width: 80px;
}
.task-detail .row a {
  color: #58a6ff;
  text-decoration: none;
}
/* P10.2: Recovery Panel styles */
.recovery-card {
  margin-bottom: 10px;
  padding: 10px;
  background: #0d1117;
  border-radius: 6px;
  border: 1px solid #21262d;
}
.recovery-card h4 {
  font-size: 12px;
  color: #8b949e;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.recovery-stat {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
  font-size: 12px;
}
.recovery-stat .label { color: #8b949e; }
.recovery-stat .value { font-weight: 600; }
.recovery-stat .value.retry { color: #58a6ff; }
.recovery-stat .value.success { color: #3fb950; }
.recovery-stat .value.warning { color: #d29922; }
.recovery-stat .value.error { color: #f85149; }
.recovery-stat .value.rollback { color: #bc8cff; }
/* Timeline filter tabs */
.timeline-tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 8px;
}
.timeline-tab {
  padding: 3px 10px;
  background: #21262d;
  border: 1px solid #30363d;
  border-radius: 10px;
  font-size: 11px;
  color: #8b949e;
  cursor: pointer;
  transition: all 0.15s;
}
.timeline-tab:hover { background: #30363d; color: #c9d1d9; }
.timeline-tab.active { background: #1c3a5c; color: #58a6ff; border-color: #58a6ff; }
.loading {
  text-align: center;
  padding: 20px;
  color: #8b949e;
}
.refresh-btn {
  background: #21262d;
  border: 1px solid #30363d;
  color: #c9d1d9;
  padding: 4px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 11px;
}
.refresh-btn:hover { background: #30363d; }
/* Responsive: stack panels on narrow screens */
@media (max-width: 1200px) {
  .container { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 800px) {
  .container { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="header">
  <h1>AI Mission Control Dashboard <span class="badge-version">v0.3</span></h1>
  <div class="stats" id="stats"></div>
</div>
<div class="container">
  <!-- Panel 1: Mission Tasks -->
  <div class="panel" id="tasks-panel">
    <div class="panel-header">
      <span>&#x1F3AF; Mission Tasks</span>
      <button class="refresh-btn" onclick="loadTasks()">Refresh</button>
    </div>
    <div class="panel-body" id="tasks-list">
      <div class="loading">Loading...</div>
    </div>
  </div>
  <!-- Panel 2: Event Timeline + Failure Timeline -->
  <div class="panel" id="events-panel">
    <div class="panel-header">
      <span id="events-title">Event Timeline</span>
      <button class="refresh-btn" onclick="loadEvents()">Refresh</button>
    </div>
    <div class="panel-body" id="events-body">
      <div class="timeline-tabs" id="timeline-tabs" style="display:none;">
        <div class="timeline-tab active" onclick="switchTab('all')">All</div>
        <div class="timeline-tab" onclick="switchTab('failure')">Failures</div>
        <div class="timeline-tab" onclick="switchTab('recovery')">Recovery</div>
      </div>
      <div class="empty-state" id="events-list">
        <div class="icon">&#x1F4CB;</div>
        <div>Select a task to view its event timeline</div>
      </div>
      <div class="empty-state" id="failure-list" style="display:none;">
        <div class="icon">&#x26A0;</div>
        <div>No failure events found</div>
      </div>
      <div class="empty-state" id="recovery-list" style="display:none;">
        <div class="icon">&#x1F504;</div>
        <div>No recovery events found</div>
      </div>
    </div>
  </div>
  <!-- Panel 3: Recovery Panel (P10.2) -->
  <div class="panel" id="recovery-panel">
    <div class="panel-header">
      <span>&#x1F6E1; Recovery Status</span>
      <button class="refresh-btn" onclick="loadRecovery()">Refresh</button>
    </div>
    <div class="panel-body" id="recovery-body">
      <div class="empty-state">
        <div class="icon">&#x1F50D;</div>
        <div>Select a task to view recovery info</div>
      </div>
    </div>
  </div>
</div>

<script>
var currentTaskId = null;
var allEvents = [];
var currentTab = 'all';

// ─── Event type filter lists ──────────────────────────────

var FAILURE_EVENT_TYPES = ['FAILED', 'RETRY_EXHAUSTED', 'ROLLBACK_FAILED', 'RECOVERY_FAILED'];
var RECOVERY_EVENT_TYPES = ['RETRY_SCHEDULED', 'RETRY_STARTED', 'RETRY_SUCCESS', 'RETRY_EXHAUSTED',
  'ROLLBACK_TRIGGERED', 'ROLLBACK_COMPLETED', 'ROLLBACK_FAILED',
  'RECOVERY_SUCCESS', 'RECOVERY_FAILED'];

function getStatusBadge(status) {
  var cls = 'badge-';
  if (!status) return '<span class="badge badge-pending">unknown</span>';
  var s = status.toLowerCase();
  if (s === 'pending') cls += 'pending';
  else if (s === 'running' || s === 'in_progress') cls += 'in_progress';
  else if (s === 'completed') cls += 'completed';
  else if (s === 'failed') cls += 'failed';
  else if (s === 'blocked') cls += 'blocked';
  else cls += 'pending';
  return '<span class="badge ' + cls + '">' + escapeHtml(status) + '</span>';
}

// P10.2: Recovery status badge
function getRecoveryBadge(status) {
  if (!status) return '<span class="badge badge-pending">-</span>';
  var cls = 'badge-';
  var s = status.toLowerCase();
  if (s === 'retrying') cls += 'retrying';
  else if (s === 'recovered' || s === 'recovery_success') cls += 'recovered';
  else if (s === 'retry_exhausted') cls += 'retry_exhausted';
  else if (s === 'rolling_back') cls += 'rolling_back';
  else if (s === 'rolled_back') cls += 'rolled_back';
  else if (s === 'rollback_failed') cls += 'rollback_failed';
  else if (s === 'unrecoverable') cls += 'unrecoverable';
  else cls += 'pending';
  return '<span class="badge ' + cls + '">' + escapeHtml(status) + '</span>';
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatTime(iso) {
  if (!iso) return '-';
  var d = new Date(iso);
  return d.toLocaleString('zh-CN', { hour12: false });
}

function getEventDotClass(eventType) {
  if (!eventType) return 'dot-info';
  var t = eventType.toLowerCase();
  if (t.indexOf('error') >= 0 || t.indexOf('failed') >= 0 || t.indexOf('exhausted') >= 0)
    return 'dot-error';
  if (t.indexOf('retry') >= 0) return 'dot-retry';
  if (t.indexOf('rollback') >= 0) return 'dot-rollback';
  if (t.indexOf('recovery') >= 0) return 'dot-recovery';
  if (t.indexOf('complete') >= 0 || t.indexOf('success') >= 0) return 'dot-success';
  if (t.indexOf('warn') >= 0) return 'dot-warn';
  return 'dot-info';
}

// ─── Tab switching ─────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  var tabs = document.querySelectorAll('.timeline-tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.toggle('active', tabs[i].textContent.toLowerCase() === tab);
  }
  renderEvents();
}

// ─── Render events based on current tab ───────────────────
function renderEvents() {
  var eventsDiv = document.getElementById('events-list');
  var failureDiv = document.getElementById('failure-list');
  var recoveryDiv = document.getElementById('recovery-list');
  var tabsDiv = document.getElementById('timeline-tabs');

  // Hide all
  eventsDiv.style.display = 'none';
  failureDiv.style.display = 'none';
  recoveryDiv.style.display = 'none';

  if (!currentTaskId) {
    eventsDiv.style.display = 'block';
    tabsDiv.style.display = 'none';
    return;
  }

  tabsDiv.style.display = 'flex';

  if (currentTab === 'all') {
    eventsDiv.style.display = 'block';
    renderEventList(eventsDiv, allEvents);
  } else if (currentTab === 'failure') {
    failureDiv.style.display = 'block';
    var failures = allEvents.filter(function(e) {
      return FAILURE_EVENT_TYPES.indexOf(e.event_type) !== -1;
    });
    renderEventList(failureDiv, failures);
  } else if (currentTab === 'recovery') {
    recoveryDiv.style.display = 'block';
    var recoveries = allEvents.filter(function(e) {
      return RECOVERY_EVENT_TYPES.indexOf(e.event_type) !== -1;
    });
    renderEventList(recoveryDiv, recoveries);
  }
}

function renderEventList(container, events) {
  if (!events || events.length === 0) {
    container.innerHTML = '<div class="empty-state"><div>No events to display</div></div>';
    return;
  }
  var html = '';
  for (var i = 0; i < events.length; i++) {
    var evt = events[i];
    var dotClass = getEventDotClass(evt.event_type);
    html += '<div class="event-item">';
    html += '<div class="dot ' + dotClass + '"></div>';
    html += '<div class="content">';
    html += '<div class="type">' + escapeHtml(evt.event_type) + '</div>';
    if (evt.stage) html += '<div class="stage">Stage: ' + escapeHtml(evt.stage) + '</div>';
    if (evt.payload) html += '<div class="payload">' + escapeHtml(JSON.stringify(evt.payload, null, 2)) + '</div>';
    html += '</div>';
    html += '<div class="time">' + formatTime(evt.created_at) + '</div>';
    html += '</div>';
  }
  container.innerHTML = html;
}

// ─── Load tasks ────────────────────────────────────────────
function loadTasks() {
  var list = document.getElementById('tasks-list');
  list.innerHTML = '<div class="loading">Loading...</div>';

  fetch('/mission/tasks')
    .then(function(r) { return r.json(); })
    .then(function(resp) {
      if (!resp.success) {
        list.innerHTML = '<div class="empty-state"><div class="icon">&#x26A0;</div><div>Failed: ' + escapeHtml(resp.error) + '</div></div>';
        return;
      }

      // Update stats
      var statsEl = document.getElementById('stats');
      var s = resp.stats;
      var total = s.total || 0;
      statsEl.innerHTML = '<span>Total: ' + total + '</span>' +
        (s.by_status ? Object.keys(s.by_status).map(function(k) {
          return '<span>' + k + ': ' + s.by_status[k] + '</span>';
        }).join('') : '');

      var tasks = resp.data || [];
      if (tasks.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="icon">&#x1F4ED;</div><div>No mission tasks yet</div></div>';
        return;
      }

      var html = '';
      for (var i = 0; i < tasks.length; i++) {
        var t = tasks[i];
        var activeClass = (currentTaskId === t.id) ? ' active' : '';
        html += '<div class="task-row' + activeClass + '" onclick="selectTask(\'' + escapeHtml(t.id) + '\')">';
        html += '<div class="top">';
        html += '<span class="title">' + escapeHtml(t.title || t.id) + '</span>';
        html += getStatusBadge(t.status);
        if (t.recovery_status) html += getRecoveryBadge(t.recovery_status);
        html += '</div>';
        html += '<div class="meta">';
        html += '<span>Agent: ' + escapeHtml(t.owner_agent) + '</span>';
        if (t.current_stage) html += '<span>Stage: ' + escapeHtml(t.current_stage) + '</span>';
        if (t.github_pr) html += '<span>PR: ' + escapeHtml(t.github_pr) + '</span>';
        if (t.retry_count > 0) html += '<span>Retries: ' + t.retry_count + '</span>';
        if (t.last_event_at) html += '<span>Last: ' + formatTime(t.last_event_at) + '</span>';
        html += '</div>';
        html += '</div>';
      }
      list.innerHTML = html;
    })
    .catch(function(e) {
      list.innerHTML = '<div class="empty-state"><div class="icon">&#x26A0;</div><div>Error: ' + escapeHtml(e.message) + '</div></div>';
    });
}

function selectTask(taskId) {
  currentTaskId = taskId;
  loadTasks();
  loadEvents();
  loadRecovery();
}

// ─── Load events ───────────────────────────────────────────
function loadEvents() {
  var eventsDiv = document.getElementById('events-list');
  var titleEl = document.getElementById('events-title');

  if (!currentTaskId) {
    eventsDiv.innerHTML = '<div class="empty-state"><div class="icon">&#x1F4CB;</div><div>Select a task to view its event timeline</div></div>';
    titleEl.textContent = 'Event Timeline';
    document.getElementById('timeline-tabs').style.display = 'none';
    return;
  }

  eventsDiv.innerHTML = '<div class="loading">Loading...</div>';
  titleEl.textContent = 'Events: ' + currentTaskId;

  fetch('/mission/tasks/' + encodeURIComponent(currentTaskId) + '/events')
    .then(function(r) { return r.json(); })
    .then(function(resp) {
      if (!resp.success) {
        eventsDiv.innerHTML = '<div class="empty-state"><div class="icon">&#x26A0;</div><div>Error: ' + escapeHtml(resp.error) + '</div></div>';
        allEvents = [];
        return;
      }

      var task = resp.task;
      allEvents = resp.events || [];

      var html = '';

      // Task detail header
      if (task) {
        html += '<div class="task-detail">';
        html += '<div class="row"><label>Task ID:</label><span>' + escapeHtml(task.id) + '</span></div>';
        html += '<div class="row"><label>Status:</label>' + getStatusBadge(task.status) + '</div>';
        html += '<div class="row"><label>Agent:</label><span>' + escapeHtml(task.owner_agent) + '</span></div>';
        html += '<div class="row"><label>Stage:</label><span>' + escapeHtml(task.current_stage || '-') + '</span></div>';
        // P10.2: Recovery fields
        if (task.recovery_status) html += '<div class="row"><label>Recovery:</label>' + getRecoveryBadge(task.recovery_status) + '</div>';
        if (task.retry_count > 0) html += '<div class="row"><label>Retries:</label><span>' + task.retry_count + '</span></div>';
        if (task.last_failure_type) html += '<div class="row"><label>Failure:</label><span style="color:#f85149">' + escapeHtml(task.last_failure_type) + '</span></div>';
        if (task.rollback_state) html += '<div class="row"><label>Rollback:</label><span>' + escapeHtml(task.rollback_state) + '</span></div>';
        if (task.github_pr) {
          html += '<div class="row"><label>GitHub PR:</label><a href="' + escapeHtml(task.github_pr) + '" target="_blank">' + escapeHtml(task.github_pr) + '</a></div>';
        }
        html += '<div class="row"><label>Created:</label><span>' + formatTime(task.created_at) + '</span></div>';
        html += '</div>';
      }

      eventsDiv.innerHTML = html;
      // Render with current tab filter
      renderEvents();
    })
    .catch(function(e) {
      eventsDiv.innerHTML = '<div class="empty-state"><div class="icon">&#x26A0;</div><div>Error: ' + escapeHtml(e.message) + '</div></div>';
      allEvents = [];
    });
}

// ─── Load recovery info (P10.2) ────────────────────────────
function loadRecovery() {
  var body = document.getElementById('recovery-body');

  if (!currentTaskId) {
    body.innerHTML = '<div class="empty-state"><div class="icon">&#x1F50D;</div><div>Select a task to view recovery info</div></div>';
    return;
  }

  body.innerHTML = '<div class="loading">Loading...</div>';

  fetch('/mission/tasks/' + encodeURIComponent(currentTaskId) + '/events')
    .then(function(r) { return r.json(); })
    .then(function(resp) {
      if (!resp.success) {
        body.innerHTML = '<div class="empty-state"><div class="icon">&#x26A0;</div><div>Error: ' + escapeHtml(resp.error) + '</div></div>';
        return;
      }

      var task = resp.task;
      if (!task) {
        body.innerHTML = '<div class="empty-state"><div class="icon">&#x1F50D;</div><div>Task not found</div></div>';
        return;
      }

      // Count recovery events
      var events = resp.events || [];
      var recoveryEvents = events.filter(function(e) {
        return RECOVERY_EVENT_TYPES.indexOf(e.event_type) !== -1;
      });
      var lastFailureEvent = null;
      for (var i = events.length - 1; i >= 0; i--) {
        if (FAILURE_EVENT_TYPES.indexOf(events[i].event_type) !== -1) {
          lastFailureEvent = events[i];
          break;
        }
      }

      // Build recovery state display
      var retryCount = task.retry_count || 0;
      var recoveryStatus = task.recovery_status || 'none';
      var failureType = task.last_failure_type || 'none';
      var rollbackState = task.rollback_state || 'none';
      var stage = task.current_stage || '-';
      var retryValClass = retryCount > 0 ? 'warning' : 'success';
      var failureValClass = failureType !== 'none' ? 'error' : 'success';
      var recoveryValClass = (recoveryStatus === 'recovered' || recoveryStatus === 'rolled_back') ? 'success' :
        (recoveryStatus === 'unrecoverable' || recoveryStatus === 'rollback_failed') ? 'error' :
        (recoveryStatus === 'retrying' || recoveryStatus === 'rolling_back') ? 'retry' :
        recoveryStatus === 'retry_exhausted' ? 'warning' : '';
      var rollbackValClass = rollbackState === 'completed' ? 'rollback' : (rollbackState === 'failed' ? 'error' : '');

      var html = '';
      // Recovery status card
      html += '<div class="recovery-card">';
      html += '<h4>Recovery State</h4>';
      html += '<div class="recovery-stat"><span class="label">Recovery Status</span>' + getRecoveryBadge(recoveryStatus) + '</div>';
      html += '<div class="recovery-stat"><span class="label">Current Stage</span><span class="value">' + escapeHtml(stage) + '</span></div>';
      html += '<div class="recovery-stat"><span class="label">Retry Count</span><span class="value ' + retryValClass + '">' + retryCount + '</span></div>';
      html += '<div class="recovery-stat"><span class="label">Last Failure</span><span class="value ' + failureValClass + '">' + escapeHtml(failureType) + '</span></div>';
      html += '<div class="recovery-stat"><span class="label">Rollback State</span><span class="value ' + rollbackValClass + '">' + escapeHtml(rollbackState) + '</span></div>';
      html += '</div>';

      // Failure events card
      html += '<div class="recovery-card">';
      html += '<h4>Recovery Events (' + recoveryEvents.length + ')</h4>';
      if (recoveryEvents.length === 0) {
        html += '<div style="font-size:12px;color:#484f58;padding:8px 0;">No recovery events recorded</div>';
      } else {
        // Show last 5 recovery events
        var recentRecovery = recoveryEvents.slice(-5).reverse();
        for (var j = 0; j < recentRecovery.length; j++) {
          var revt = recentRecovery[j];
          var dotClass = getEventDotClass(revt.event_type);
          html += '<div class="event-item">';
          html += '<div class="dot ' + dotClass + '"></div>';
          html += '<div class="content">';
          html += '<div class="type">' + escapeHtml(revt.event_type) + '</div>';
          html += '</div>';
          html += '<div class="time">' + formatTime(revt.created_at) + '</div>';
          html += '</div>';
        }
      }
      html += '</div>';

      // Last failure detail
      if (lastFailureEvent) {
        html += '<div class="recovery-card">';
        html += '<h4>Last Failure Detail</h4>';
        html += '<div style="font-size:11px;color:#f85149;">Type: ' + escapeHtml(lastFailureEvent.event_type) + '</div>';
        html += '<div style="font-size:10px;color:#6e7681;margin-top:2px;">Time: ' + formatTime(lastFailureEvent.created_at) + '</div>';
        if (lastFailureEvent.payload) {
          html += '<div class="payload" style="margin-top:4px;font-size:10px;">' + escapeHtml(JSON.stringify(lastFailureEvent.payload, null, 2)) + '</div>';
        }
        html += '</div>';
      }

      body.innerHTML = html;
    })
    .catch(function(e) {
      body.innerHTML = '<div class="empty-state"><div class="icon">&#x26A0;</div><div>Error: ' + escapeHtml(e.message) + '</div></div>';
    });
}

// Auto-refresh every 10 seconds
setInterval(function() {
  loadTasks();
  if (currentTaskId) {
    loadEvents();
    loadRecovery();
  }
}, 10000);

// Initial load
loadTasks();
</script>
</body>
